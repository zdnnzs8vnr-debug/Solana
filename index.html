/* ------------------------------ error guard ------------------------------ */
class Boundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(e){ return {err:e}; }

        <div style={{padding:26,fontFamily:"'JetBrains Mono',monospace",color:'#ff5c5c',fontSize:13,lineHeight:1.8}}>

}

function Scramble({text,className,style,speed}){
  const [out,setOut]=useState(text);
  const raf=useRef(0);
  useEffect(function(){
    if(reduce()){ setOut(text); return; }
    const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&/*+-<>[]{}';
    let frame=0;
    const total=Math.max(12, text.length*2);
    function tick(){
      frame++;
      const p=frame/total;
      let s='';
      for(let i=0;i<text.length;i++){
        const th=(i+1)/text.length;
        if(p>th) s+=text[i];
        else if(text[i]===' ') s+=' ';
        else s+=chars[Math.floor(Math.random()*chars.length)];
      }
      setOut(s);
      if(frame<total) raf.current=requestAnimationFrame(tick);
      else setOut(text);
    }
    raf.current=requestAnimationFrame(tick);
    return function(){cancelAnimationFrame(raf.current);};
  },[text]);
  return <span className={className} style={style}>{out}</span>;
}

function TypeLine({text,speed,delay,className}){
  const sp=speed||20, dl=delay||0;
  const [n,setN]=useState(0);
  useEffect(function(){
    if(reduce()){ setN(text.length); return; }
    let i=0; let t;
    function step(){
      i++; setN(i);
      if(i<text.length) t=setTimeout(step,sp);
    }
    t=setTimeout(step,dl);
    return function(){clearTimeout(t);};
  },[text]);
  return <span className={className}>{text.slice(0,n)}{n<text.length?<span className="caret"/>:null}</span>;
}

function HexStream({rows,cols,interval}){
  const R=rows||6, C=cols||40, I=interval||150;
  const [data,setData]=useState(function(){ const a=[]; for(let i=0;i<R;i++) a.push(hexLine(C)); return a; });
  useEffect(function(){
    const iv=setInterval(function(){
      setData(function(d){ return d.slice(1).concat([hexLine(C)]); });
    },I);
    return function(){clearInterval(iv);};
  },[R,C,I]);
  return (
    <div className="mono" style={{fontSize:10,lineHeight:1.75,color:'#5f7f74',wordBreak:'break-all'}}>
      {data.map(function(l,i){
        return <div key={i} style={{color: i===data.length-1?'var(--tl)':undefined}}>{l}</div>;
      })}
    </div>
  );
}

function Matrix(){
  const ref=useRef(null);
  useEffect(function(){
    const c=ref.current; if(!c) return;
    const ctx=c.getContext('2d'); if(!ctx) return;
    let w=0,h=0,cols=0,drops=[];
    const fontSize=14, chars='01ABCDEF<>#$%&';
    function size(){
      w=c.width=c.offsetWidth||window.innerWidth;
      h=c.height=c.offsetHeight||window.innerHeight;
      cols=Math.max(1,Math.floor(w/fontSize));
      drops=[]; for(let i=0;i<cols;i++) drops.push(Math.random()*h/16);
    }
    size();
    let raf=0,last=0;
    function draw(ts){
      raf=requestAnimationFrame(draw);
      if(ts-last<58) return; last=ts;
      ctx.fillStyle='rgba(5,6,13,.16)'; ctx.fillRect(0,0,w,h);
      ctx.font=fontSize+'px monospace';
      for(let i=0;i<cols;i++){
        const ch=chars[Math.floor(Math.random()*chars.length)];
        ctx.fillStyle = Math.random()>0.94 ? '#ffb020' : '#12c39a';
        ctx.fillText(ch, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize>h && Math.random()>0.975) drops[i]=0;
        drops[i]+=0.62;
      }
    }
    raf=requestAnimationFrame(draw);
    window.addEventListener('resize',size);
    return function(){cancelAnimationFrame(raf); window.removeEventListener('resize',size);};
  },[]);
  return <canvas ref={ref} style={{position:'fixed',inset:0,zIndex:0,opacity:.45,pointerEvents:'none'}}/>;
}

function VerifyModal({group,item,onClose}){
  const tr=useT();
  const ph=group==='50'?PHOTO.eur50:PHOTO.eur20;
  const gal=ph.gallery;
  const [idx,setIdx]=useState(0);
  const [step,setStep]=useState(0);
  useEffect(function(){
    const iv=setInterval(function(){ setIdx(function(i){return (i+1)%gal.length;}); },3400);
    return function(){clearInterval(iv);};
  },[gal.length]);
  useEffect(function(){
    function onKey(e){ if(e.key==='Escape') onClose(); }
    window.addEventListener('keydown',onKey);
    return function(){window.removeEventListener('keydown',onKey);};
  },[]);
  function pick(i){ setIdx(i); }
  return (
    <React.Fragment>
      <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:70,background:'rgba(2,3,8,.82)'}}/>
      <div style={{position:'fixed',inset:0,zIndex:71,display:'flex',alignItems:'center',justifyContent:'center',padding:16,pointerEvents:'none'}}>
        <div className="card card-br fadeup" style={{pointerEvents:'auto',width:'100%',maxWidth:820,maxHeight:'92dvh',overflowY:'auto',background:'#0e1018'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 16px',height:60,borderBottom:'1px solid var(--line)',background:'#141726',position:'sticky',top:0,zIndex:2}}>
            <div>
              <div className="eyebrow">{tr.cash.modalTitle}</div>
              <div className="mono" style={{fontSize:10,color:'#6b7392',marginTop:2}}>
                {group} EUR · {tr.cash.labels[item.id]} · {gal.length} FILE
              </div>
            </div>
            <button className="btn btn-sm" onClick={onClose}>{tr.common.close}</button>
          </div>
          <div style={{padding:16}}>
            <Img src={gal[idx]} alt={tr.cash.labels[item.id]} ratio="16 / 10"
              badge={isVid(gal[idx])?<span className="vbadge">{tr.cash.videoBadge}</span>:<span className="gbadge">{tr.cash.photoBadge}</span>}/>
            <div className="mono mt-3" style={{fontSize:10.5,color:'#6b7392',textAlign:'center'}}>{tr.cash.inspecNote}</div>
            <div className="flex gap-2 mt-4 justify-center flex-wrap">
              {gal.map(function(g,i){
                return (
                  <button key={i} onClick={function(){pick(i);}} title={isVid(g)?tr.cash.videoBadge:tr.cash.photoBadge}
                    style={{width:62,height:44,padding:0,borderRadius:8,overflow:'hidden',position:'relative',
                      border:'2px solid '+(i===idx?'var(--au)':'var(--line)'),background:'#080a12',cursor:'pointer'}}>
                    <img src={g} alt="" style={{width:'100%',height:'100%',objectFit:'contain'}}/>
                    {isVid(g) && <span style={{position:'absolute',top:2,right:3,fontSize:8,color:'var(--mg)',fontFamily:"'JetBrains Mono',monospace"}}>VID</span>}
                  </button>
                );
              })}
            </div>
            <div className="mt-6 flex flex-col gap-3">
              {tr.cash.steps.map(function(s,i){
                const on=(step===i);
                const sc=['au','bl','tl','mg'][i%4];
                return (
                  <button key={i} onClick={function(){setStep(i); pick(i%gal.length);}}
                    className="card" style={{padding:14,textAlign:'left',cursor:'pointer',
                      borderColor:on?'var(--'+sc+')':'var(--line)',background:on?'#161320':'#0b0d17'}}>
                    <div className="flex gap-3 items-start">
                      <div style={{width:64,flex:'0 0 auto'}}>
                        <Img src={gal[i%gal.length]} alt="" ratio="4 / 3"/>
                      </div>
                      <div style={{flex:1}}>
                        <div className="mono" style={{fontSize:10.5,color:on?'var(--'+sc+')':'#6b7392'}}>STEP {String(i+1).padStart(2,'0')}</div>
                        <div style={{fontWeight:700,fontSize:13.5,marginTop:3}}>{s}</div>
                        <p className="dim" style={{fontSize:12.5,lineHeight:1.6,marginTop:5}}>{tr.cash.modalDesc[i]}</p>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
            <div className="mono mt-5 flex flex-wrap justify-between gap-3" style={{fontSize:10.5,color:'#6b7392'}}>
              <span>checksum {fnv(group+item.id+item.price)}</span>
              <span>grade AAA+ · uv full · scanner pass · fibra cotone</span>
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

function Checkout(){
  const tr=useT();
  const A=useApp();
  const cart=Array.isArray(A.cart)?A.cart:[];
  const [step,setStep]=useState(0);
  const [form,setForm]=useState({name:'',surname:'',address:'',city:'',zip:'',country:'',phone:'+39',email1:'',email2:''});
  const [pay,setPay]=useState('crypto');
  const [net,setNet]=useState('USDT');
  const [amazon,setAmazon]=useState('');
  const [err,setErr]=useState('');
  const [order,setOrder]=useState(null);
  const [proc,setProc]=useState(false);
  const [plines,setPlines]=useState([]);
  const [left,setLeft]=useState(1800);
  const [copied,setCopied]=useState('');
  const draft=useMemo(function(){return 'DRF-'+hex(8).toUpperCase();},[]);
  const sess=useMemo(function(){return 'SES-'+hex(10).toUpperCase();},[]);

  const hasNotes=cart.some(function(i){return i.kind==='note';});
  const hasTr=cart.some(function(i){return i.kind==='transfer';});
  const total=cart.reduce(function(s,i){return s+i.price*i.qty;},0);
  const payable=pay==='sepa'?Math.round(total*1.1):pay==='amazon'?Math.round(total*1.2):total;
  const cartHash=fnv(cart.map(function(i){return i.id+':'+i.qty;}).join('|')+total);
  const integrity=fnv(JSON.stringify(form)+step+cartHash);
  const stamp=new Date().toISOString().replace('T',' ').substring(0,19);

  useEffect(function(){
    if(step!==2||pay!=='crypto') return undefined;
    const iv=setInterval(function(){setLeft(function(l){return l>0?l-1:0;});},1000);
    return function(){clearInterval(iv);};
  },[step,pay]);

  function F(k){ return function(e){ setForm(function(f){return Object.assign({},f,{[k]:e.target.value});}); setErr(''); }; }
  function copy(txt,tag){
    try{ if(navigator.clipboard) navigator.clipboard.writeText(txt); }catch(e){}
    setCopied(tag); A.toast(tr.checkout.copied); setTimeout(function(){setCopied('');},1400);
  }
  function validate0(){
    if(hasNotes){
      if(!form.name||!form.surname||!form.address||!form.city||!form.zip||!form.country||!form.phone) return tr.checkout.required;
    }
    if(hasTr){
      const e=form.email1.trim();
      if(!/^[^@\s]+@[^@\s]+\.[a-zA-Z]{2,}$/.test(e)) return tr.checkout.emailInvalid;
      if(e.toLowerCase()!==form.email2.trim().toLowerCase()) return tr.checkout.emailMismatch;
    }
    return '';
  }
  function next(){
    if(step===0){ const e=validate0(); if(e){setErr(e);return;} }
    setStep(function(s){return s+1;});
    try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
  }
  function back(){setStep(function(s){return Math.max(0,s-1);});}

  function placeOrder(){
    const tags=cart.map(function(i){return i.tag;}).join('-');
    const code='GST-'+tags+'-'+randCode(4);
    const o={code:code,ts:Date.now(),total:total,payable:payable,pay:pay,net:net,email:form.email1,
      items:cart.map(function(i){return {id:i.id,title:i.title,qty:i.qty,price:i.price};}),
      session:sess,draft:draft,nonce:hex(14).toUpperCase(),checksum:''};

    setOrder(o);
    const lines=[

      'broadcasting order '+o.code,

      'anchoring block #'+(8821+Math.floor(Math.random()*40)),
      'receipt generated · 0 errors'

    setProc(true); setPlines([]);

      k++; setPlines(lines.slice(0,k));

'--------------------------------------------------\n'+
'ITEMS\n'+
order.items.map(function(i){return ' '+i.qty+'x '+i.title+'  EUR '+(i.price*i.qty);}).join('\n')+'\n'+
'--------------------------------------------------\n'+
'PGP SIGNATURE (armored preview)\n'+
'-----BEGIN PGP SIGNATURE-----\n'+
'Version: GUSTAVOEURO 4096\n'+
fnv(order.checksum+'a').toUpperCase()+fnv(order.checksum+'b').toUpperCase()+'\n'+
fnv(order.checksum+'c').toUpperCase()+fnv(order.checksum+'d').toUpperCase()+'\n'+
'= '+fnv(order.nonce).substring(0,5)+'\n'+
'-----END PGP SIGNATURE-----\n'+
'==================================================\n'+
'verify: node verify.js '+order.code+'\n'+
'==================================================';
    const blob=new Blob([txt],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=order.code+'.txt';
    a.click();
  }

  if(cart.length===0 && !order){

                    <p className="mono mt-1 mb-4" style={{fontSize:10.5,color:'#6b7392'}}>// {tr.checkout.shippingNote}</p>
                    <div className="grid gap-3" style={{gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))'}}>
                      <Field l={tr.checkout.name} v={form.name} on={F('name')}/>
                      <Field l={tr.checkout.surname} v={form.surname} on={F('surname')}/>
                      <Field l={tr.checkout.address} v={form.address} on={F('address')} full/>
                      <Field l={tr.checkout.city} v={form.city} on={F('city')}/>
                      <Field l={tr.checkout.zip} v={form.zip} on={F('zip')}/>
                      <Field l={tr.checkout.country} v={form.country} on={F('country')}/>
                      <div>
                        <Label>{tr.checkout.phone}</Label>
                        <div className="flex gap-2">
                          <select className="inp" style={{width:110}}
                            value={form.phone.indexOf(' ')>=0?form.phone.split(' ')[0]:form.phone}
                            onChange={function(e){setForm(function(f){return Object.assign({},f,{phone:e.target.value});});}}>
                            {PREFIXES.map(function(p){return <option key={p} value={p}>{p}</option>;})}
                          </select>
                          <input className="inp"
                            value={form.phone.indexOf(' ')>=0?form.phone.split(' ').slice(1).join(' '):''}
                            onChange={function(e){const pre=form.phone.split(' ')[0]||'+39';
                              setForm(function(f){return Object.assign({},f,{phone:pre+' '+e.target.value});});}}
                            placeholder="000 000 0000"/>
                        </div>
                      </div>
                    </div>
                  </React.Fragment>
                )}
                {hasTr && (
                  <div className={hasNotes?'mt-7':''}>
                    <Eyebrow color="bl">{tr.checkout.emailSec}</Eyebrow>
                    <p className="mono mt-1 mb-4" style={{fontSize:10.5,color:'#6b7392'}}>// {tr.checkout.emailNote}</p>
                    <div className="grid gap-3" style={{gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}}>
                      <Field l={tr.checkout.email1} v={form.email1} on={F('email1')} type="email"/>
                      <Field l={tr.checkout.email2} v={form.email2} on={F('email2')} type="email"/>
                    </div>
                  </div>
                )}
                {err && <div className="mono mt-4" style={{fontSize:11.5,color:'var(--rs)'}}>✕ {err}</div>}
              </Bracket>
            )}

            {step===1 && (
              <Bracket className="p-5 sm:p-6">
                <Eyebrow color="tl">{tr.checkout.manifest}</Eyebrow>
                <div className="term mt-4" style={{fontSize:11.5}}>
                  <div className="c"># line  hash        qty  amount   item</div>
                  {cart.map(function(it,i){
                    const h=fnv(it.id+it.qty+it.price);
                    return <div key={i}><span className="k">{String(i+1).padStart(2,'0')}</span>&nbsp;&nbsp;{h.substring(0,10)}  {String(it.qty).padStart(2,'0')}   {eur(it.price*it.qty)}   {it.title}</div>;
                  })}
                  <div className="c"># merkle root {fnv(cartHash)}</div>
                  <div className="k">&gt; total {eur(total)}</div>
                </div>
                <div className="mt-5">
                  <Eyebrow color="au">{tr.checkout.signature}</Eyebrow>
                  <div className="term mt-3" style={{fontSize:10.5}}>
                    <div>-----BEGIN PGP SIGNATURE-----</div>
                    <div>{fnv(cartHash+'x').toUpperCase()}{fnv(cartHash+'y').toUpperCase()}</div>
                    <div>{fnv(cartHash+'z').toUpperCase()}{fnv(cartHash+'w').toUpperCase()}</div>
                    <div>= {fnv(String(total)).substring(0,5)}</div>
                    <div>-----END PGP SIGNATURE-----</div>
                  </div>
                </div>
                <div className="flex justify-between mono mt-5" style={{fontSize:13}}>
                  <span style={{color:'#8b93ad'}}>{tr.checkout.tot}</span>
                  <span style={{color:'var(--au)',fontWeight:700}}>{eur(total)}</span>
                </div>
              </Bracket>
            )}

            {step===2 && (
              <Bracket className="p-5 sm:p-6">
                <Eyebrow>{tr.checkout.method}</Eyebrow>
                <div className="grid gap-2 mt-4" style={{gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
                  {[['crypto','tl',tr.checkout.crypto,tr.checkout.fee0],
                    ['sepa','bl',tr.checkout.sepa,tr.checkout.fee10],
                    ['amazon','mg',tr.checkout.amazon,tr.checkout.fee20]].map(function(m){
                    return (
                      <button key={m[0]} className="card p-4" onClick={function(){setPay(m[0]);}}
                        style={{cursor:'pointer',textAlign:'left',borderColor:pay===m[0]?'var(--'+m[1]+')':'var(--line)'}}>
                        <div className="flex items-center justify-between">
                          <span style={{fontWeight:600,fontSize:13.5}}>{m[2]}</span>
                          {m[0]==='crypto' && <Pill color="tl">{tr.checkout.recommended}</Pill>}
                        </div>
                        <div className="mono mt-2" style={{fontSize:10.5,color:'var(--'+m[1]+')'}}>{m[3]}</div>
                      </button>
                    );
                  })}
                </div>

                {pay==='crypto' && (
                  <div className="mt-6">
                    <div className="flex gap-2 flex-wrap">
                      {['USDT','BTC','LTC'].map(function(n,i){
                        const c=['tl','au','bl'][i];
                        return <button key={n} className="btn btn-sm" onClick={function(){setNet(n);}}
                          style={{borderColor:net===n?'var(--'+c+')':'var(--line)',color:net===n?'var(--'+c+')':'#c3cadf'}}>{n}</button>;
                      })}
                    </div>
                    <div className="grid gap-5 mt-5" style={{gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))'}}>
                      <div>
                        <div style={{background:'#fff',padding:10,borderRadius:12,width:'fit-content'}}>
                          <img alt="qr" width={180} height={180}
                            src={'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(WALLET[net])}/>
                        </div>
                        <div className="mono mt-2" style={{fontSize:10.5,color:'#6b7392'}}>{tr.checkout.scan}</div>
                      </div>
                      <div className="mono flex flex-col gap-3" style={{fontSize:12}}>
                        <div>
                          <div style={{fontSize:10,color:'#7b839c',letterSpacing:'.14em'}}>{tr.checkout.address} · {net}</div>
                          <div className="flex gap-2 items-center mt-1">
                            <span style={{wordBreak:'break-all',color:'var(--fg)'}}>{WALLET[net]}</span>
                            <button className="btn btn-sm" style={{flex:'0 0 auto'}} onClick={function(){copy(WALLET[net],'addr');}}>{copied==='addr'?'✓':tr.checkout.copy}</button>
                          </div>
                        </div>
                        <Row k={tr.checkout.amount} v={eur(payable)} c="var(--au)"/>
                        <div>
                          <div style={{fontSize:10,color:'#7b839c',letterSpacing:'.14em'}}>{tr.checkout.memo}</div>
                          <div className="flex gap-2 items-center mt-1">
                            <span style={{color:'var(--bl)'}}>{'GE-'+fnv(cartHash).toUpperCase()}</span>
                            <button className="btn btn-sm" style={{flex:'0 0 auto'}} onClick={function(){copy('GE-'+fnv(cartHash).toUpperCase(),'memo');}}>{copied==='memo'?'✓':tr.checkout.copy}</button>
                          </div>
                        </div>
                        <Row k={tr.checkout.confirmations} v="0/2" c="var(--rs)"/>
                        <Row k="COUNTDOWN" v={String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')} c="var(--tl)"/>
                      </div>
                    </div>
                    <div className="term mt-5" style={{fontSize:11}}>
                      <div className="c"># pending transaction</div>
                      <div>from  : {net}-WALLET</div>
                      <div>to    : {WALLET[net].substring(0,16)}…</div>
                      <div>value : {payable} EUR</div>
                      <div>memo  : GE-{fnv(cartHash).toUpperCase()}</div>
                      <div>status: <span className="k">awaiting broadcast</span></div>
                    </div>
                  </div>
                )}

                {pay==='sepa' && (
                  <div className="mt-6 term" style={{fontSize:12}}>
                    <div className="k">{tr.checkout.iban}</div>
                    <div className="c"># +10% handling included in payable</div>
                    <div>amount: {eur(payable)}</div>
                    <div>ref   : GE-{fnv(cartHash).toUpperCase()}</div>
                  </div>
                )}

                {pay==='amazon' && (
                  <div className="mt-6">
                    <Label>{tr.checkout.amazon}</Label>
                    <input className="inp" inputMode="numeric" maxLength={15} value={amazon}
                      onChange={function(e){setAmazon(e.target.value.replace(/\D/g,'').slice(0,15));}} placeholder={tr.checkout.amazonPh}/>
                    <div className="mono mt-3 flex justify-between" style={{fontSize:11,color:amazon.length===15?'var(--tl)':'#7b839c'}}>
                      <span>{amazon.length}/15</span><span>{tr.checkout.fee20}</span>
                    </div>
                  </div>
                )}

                <div className="flex justify-between mono mt-6" style={{fontSize:13}}>
                  <span style={{color:'#8b93ad'}}>{tr.checkout.payable}</span>
                  <span style={{color:'var(--au)',fontWeight:700}}>{eur(payable)}</span>
                </div>
              </Bracket>
            )}

            {step===3 && order && (
              <Bracket className="p-5 sm:p-6">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <Eyebrow color="tl">{tr.checkout.receipt}</Eyebrow>
                  <Pill color="tl">✓ {tr.checkout.done}</Pill>
                </div>
                <div className="mt-5 flex flex-wrap gap-2">
                  {tr.checkout.badges.map(function(b,i){return <Pill key={b} color={['au','bl','tl','mg','rs'][i%5]}>{b}</Pill>;})}
                </div>
                <div className="term mt-5" style={{fontSize:11.5}}>
                  <div className="k">ORDER CODE ...... {order.code}</div>
                  <div>SESSION ......... {order.session}</div>
                  <div>DRAFT ........... {order.draft}</div>
                  <div>TIMESTAMP ....... {new Date(order.ts).toISOString()}</div>
                  <div>{tr.checkout.nonce} ........... {order.nonce}</div>
                  <div>{tr.checkout.checksum} ........ {order.checksum}</div>
                  <div className="c">-----BEGIN PGP SIGNATURE-----</div>
                  <div>{fnv(order.checksum+'a').toUpperCase()}{fnv(order.checksum+'b').toUpperCase()}</div>
                  <div>{fnv(order.checksum+'c').toUpperCase()}{fnv(order.checksum+'d').toUpperCase()}</div>
                  <div className="c">= {fnv(order.nonce).substring(0,5)}</div>
                  <div className="c">-----END PGP SIGNATURE-----</div>
                </div>
                <Eyebrow color="au" className="mt-5">{tr.checkout.verifyScript}</Eyebrow>
                <div className="term mt-3" style={{fontSize:11.5}}>
                  <div>$ node verify.js {order.code}</div>
                  <div className="k">&gt; hash ok · signature valid · 0 errors</div>
                </div>
                <div className="flex flex-wrap gap-2 mt-5">
                  <button className="btn btn-au" onClick={download}>{tr.checkout.download}</button>
                  <button className="btn btn-bl" onClick={function(){A.navigate('/track');}}>{tr.nav.track}</button>
                </div>
                <div className="card mt-6 p-5" style={{borderColor:'var(--rs)'}}>
                  <div className="mono" style={{fontSize:12.5,color:'var(--rs)',letterSpacing:'.1em',fontWeight:700}}>{tr.checkout.tgTitle}</div>
                  <p className="dim mt-2" style={{fontSize:13.5,lineHeight:1.7}}>{tr.checkout.tgText}</p>
                  <a className="btn btn-au mt-4" href={TG} target="_blank" rel="noopener noreferrer">{tr.checkout.tgBtn}</a>
                </div>
              </Bracket>
            )}
          </div>

          <div>
            <Bracket className="p-5" style={{position:'sticky',top:110}}>
              <Eyebrow color="bl">{tr.checkout.console}</Eyebrow>
              <div className="mono mt-4 flex flex-col gap-2" style={{fontSize:10.5}}>
                <Row k={tr.checkout.draft} v={draft} c="var(--au)"/>
                <Row k={tr.checkout.session} v={sess}/>
                <Row k={tr.checkout.timestamp} v={stamp}/>
                <Row k={tr.checkout.cartHash} v={cartHash} c="var(--bl)"/>
                <Row k={tr.checkout.pgp} v="VALID · 4096" c="var(--tl)"/>
                <Row k={tr.checkout.node} v={ONION.substring(0,14)+'…'}/>
                <Row k={tr.checkout.integrity} v={integrity} c="var(--mg)"/>
              </div>
              <div className="mt-4"><HexStream rows={3} cols={30}/></div>
              <div className="hr my-4"/>
              <div className="flex justify-between mono" style={{fontSize:13}}>
                <span style={{color:'#8b93ad'}}>{tr.checkout.tot}</span>
                <span style={{color:'var(--au)',fontWeight:700}}>{eur(total)}</span>
              </div>
              <div className="flex flex-wrap gap-2 mt-4">
                {step>0 && step<3 && <button className="btn" onClick={back}>{tr.checkout.back}</button>}
                {step<2 && <button className="btn btn-au flex-1" onClick={next} disabled={cart.length===0}>{tr.checkout.cont}</button>}
                {step===2 && <button className="btn btn-au flex-1" onClick={placeOrder}>{tr.checkout.pay}</button>}
              </div>
              <div className="mono mt-3" style={{fontSize:10,color:'#5c6480'}}>{tr.checkout.note}</div>
            </Bracket>
          </div>
        </div>
      </Section>

      {proc && (
        <div style={{position:'fixed',inset:0,zIndex:80,background:'rgba(3,4,10,.95)',
          display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
          <div className="card card-br p-6 fadeup" style={{width:'100%',maxWidth:560}}>
            <Eyebrow color="au">{tr.checkout.processing}</Eyebrow>
            <div className="term mt-4" style={{fontSize:12}}>
              {plines.map(function(l,i){return <div key={i}><span className="k">&gt;</span> {l}</div>;})}
              <div><span className="k">&gt;</span> <span className="caret"/></div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* =============================== NOT FOUND =============================== */
function NotFound(){
  const tr=useT();
  const app=useApp();
  return (
    <Section className="pt-20 pb-24 text-center fadeup">
      <div className="mono grad" style={{fontSize:'clamp(44px,10vw,90px)',fontWeight:700}}>404</div>
      <div className="mono mt-3" style={{fontSize:12,color:'#7b839c'}}>{tr.notfound.t}</div>
      <button className="btn btn-au mt-7" onClick={function(){app.navigate('/node');}}>{tr.notfound.b}</button>
    </Section>
  );
}

/* ================================== APP ================================== */
function App(){
  const [lang,setLang]=useState(function(){return lsGet('ge-lang','it');});
  const [route,setRoute]=useState(function(){return window.location.hash.replace(/^#/,'')||'/boot';});
  const [authed,setAuthed]=useState(function(){return ssGet('ge-in','')==='1';});
  const [cart,setCart]=useState(function(){return lsArr('ge-cart');});
  const [drawer,setDrawer]=useState(false);
  const [menu,setMenu]=useState(false);
  const [toast,setToast]=useState('');
  const [flash,setFlash]=useState(0);

  useEffect(function(){
    function on(){ setRoute(window.location.hash.replace(/^#/,'')||'/boot'); setFlash(function(f){return f+1;}); }
    window.addEventListener('hashchange',on);
    return function(){window.removeEventListener('hashchange',on);};
  },[]);
  useEffect(function(){ lsSet('ge-lang',lang); try{document.documentElement.lang=lang;}catch(e){} },[lang]);
  useEffect(function(){ lsSet('ge-cart',JSON.stringify(cart)); },[cart]);
  useEffect(function(){ try{window.scrollTo(0,0);}catch(e){} },[route]);
  useEffect(function(){
    if(!authed && route!=='/gate' && route!=='/boot'){ window.location.hash='#/gate'; }
  },[authed,route]);

  const navigate=useCallback(function(p){ window.location.hash='#'+p; },[]);
  const say=useCallback(function(m){ setToast(m); setTimeout(function(){setToast('');},1700); },[]);
  const add=useCallback(function(item){
    setCart(function(c){
      const arr=Array.isArray(c)?c:[];
      const found=arr.filter(function(x){return x.id===item.id&&x.kind===item.kind;})[0];
      if(found) return arr.map(function(x){return x===found?Object.assign({},x,{qty:x.qty+1}):x;});
      return arr.concat([Object.assign({},item,{uid:hex(6),qty:1})]);
    });
    say((T[lsGet('ge-lang','it')]||T.it).common.added);
  },[say]);
  const remove=useCallback(function(uid){setCart(function(c){return (Array.isArray(c)?c:[]).filter(function(x){return x.uid!==uid;});});},[]);
  const setQty=useCallback(function(uid,q){setCart(function(c){return (Array.isArray(c)?c:[]).map(function(x){return x.uid===uid?Object.assign({},x,{qty:Math.max(1,q)}):x;});});},[]);
  const clear=useCallback(function(){setCart([]);},[]);
  const total=(Array.isArray(cart)?cart:[]).reduce(function(s,i){return s+i.price*i.qty;},0);

  const app={route:route,navigate:navigate,cart:cart,add:add,remove:remove,setQty:setQty,
    clear:clear,total:total,lang:lang,setLang:setLang,toast:say};

  let page=null;
  if(route==='/boot'){
    page=<Boot onDone={function(){ const a=ssGet('ge-in','')==='1'; setAuthed(a); navigate(a?'/node':'/gate'); }}/>;
  } else if(!authed){
    page=<Gate onAuth={function(){ setAuthed(true); navigate('/node'); }}/>;
  } else {
    switch(route){
      case '/gate': page=<Gate onAuth={function(){ setAuthed(true); navigate('/node'); }}/>; break;
      case '/node': page=<Home/>; break;
      case '/cash': page=<Cash/>; break;
      case '/paypal': page=<Paypal/>; break;
      case '/quality': page=<Quality/>; break;
      case '/trust': page=<Trust/>; break;
      case '/feedback': page=<Feedback/>; break;
      case '/faq': page=<Faq/>; break;
      case '/track': page=<Track/>; break;
      case '/privacy': page=<Legal which="privacy"/>; break;
      case '/terms': page=<Legal which="terms"/>; break;
      case '/cookies': page=<Legal which="cookies"/>; break;
      case '/checkout': page=<Checkout/>; break;
      default: page=<NotFound/>;
    }
  }

  const bare=(route==='/boot'||!authed);

  return (
    <AppCtx.Provider value={app}>
      <LangCtx.Provider value={lang}>
        <div className="bgfx" aria-hidden="true">
          <div className="lines"/>
          <div className="blob b1"/><div className="blob b2"/><div className="blob b3"/><div className="blob b4"/>
        </div>
        <div className="fx-vig" aria-hidden="true"/>
        <div className="fx-scan" aria-hidden="true"/>
        {flash>0 && <div className="flash" key={flash}/>}
        <div className="wrap">
          {!bare && <Header onCart={function(){setDrawer(true);}} onMenu={function(){setMenu(true);}}/>}
          <main>{page}</main>
          {!bare && <Footer/>}
        </div>
        {drawer && <CartDrawer onClose={function(){setDrawer(false);}}/>}
        {menu && <MobileMenu onClose={function(){setMenu(false);}}/>}
        {!bare && <Fab/>}
        <Toast msg={toast}/>
      </LangCtx.Provider>
    </AppCtx.Provider>
  );
}

window.__GE_MOUNTED=true;
ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App/></Boundary>);
</script>
</body>
</html>
