<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>404 — GUSTAVOEURO</title>
<meta name="robots" content="noindex, nofollow"/>
<style>
  :root{--bg:#05060d;--fg:#eef0f8;--au:#ffb020;--line:#1d2130;--tl:#14e0b0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
  .n{font-size:clamp(48px,12vw,110px);font-weight:700;line-height:1;letter-spacing:.06em;
    background:linear-gradient(100deg,#ffc44d,#ff3d9a 50%,#14e0b0);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .s{margin-top:14px;font-size:12px;letter-spacing:.22em;color:#8b93ad;text-transform:uppercase}
  .r{margin-top:10px;font-size:11px;color:#5c6480;word-break:break-all}
  a{margin-top:26px;display:inline-flex;align-items:center;padding:12px 20px;border:1px solid var(--line);
    border-radius:10px;color:var(--fg);text-decoration:none;font-size:12px;letter-spacing:.14em;min-height:44px}
  .bar{margin:24px auto 0;width:220px;height:6px;border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#ffc44d,#14e0b0);
    animation:go 1.1s ease-in-out infinite alternate}
  @keyframes go{from{transform:translateX(-40%)}to{transform:translateX(160%)}}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
  <div>
    <div class="n">404</div>
    <div class="s">ROUTE NOT FOUND · REROUTING</div>
    <div class="bar"><i></i></div>
    <div class="r" id="ref">GUSTAVOEURO · gustavoeuro7x2k.onion</div>
    <a id="back" href="/">TORNA AL NODO</a>
  </div>
<script>
(function(){
  var h = window.location.hash || '';
  var dest = '/' + (h ? h : '#/boot');
  document.getElementById('back').setAttribute('href', dest);
  document.getElementById('ref').textContent = 'redirect → ' + dest;
  setTimeout(function(){ window.location.replace(dest); }, 800);
})();
</script>
</body>
</html>
