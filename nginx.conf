# ============================================================
# GUSTAVOEURO — nginx
# ============================================================
server {
  listen 443 ssl http2;
  server_name gustavoeuro.example;

  root /var/www/gustavoeuro;
  index index.html;

  # TLS
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # header sicurezza
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://i.ibb.co https://api.qrserver.com; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;
  server_tokens off;

  # nascondi versione
  more_set_headers "Server: ge-node";

  # file nascosti
  location ~ /\.(?!well-known) { deny all; }

  # cache
  location ~* \.(js|css)$ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "public, max-age=0, must-revalidate"; }
  location = /sw.js { add_header Cache-Control "public, max-age=0, must-revalidate"; }

  location = /.well-known/security.txt { default_type text/plain; }

  # SPA
  location / { try_files $uri $uri/ /index.html; }

  error_page 404 /404.html;

  # gzip
  gzip on;
  gzip_types text/html text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 512;

  # rate limit anti-scan
  limit_req_zone $binary_remote_addr zone=ge:10m rate=20r/s;
  location ~ ^/(index\.html)?$ { limit_req zone=ge burst=40 nodelay; try_files $uri /index.html; }
}
