# ============================================================
# GUSTAVOEURO — regole firewall / anti-identificazione
# ============================================================

# ---------- CLOUDFLARE (proxy davanti al sito: nasconde l'IP reale) ----------
# 1. DNS: record A/AAAA in modalita' PROXIED (nuvola arancione) -> l'IP vero non compare.
# 2. SSL/TLS: FULL (STRICT).  Always Use HTTPS ON.  HSTS ON.
# 3. Bot Fight Mode: ON.
# 4. Security Level: HIGH.  Challenge Passage: 30 min.
# 5. Regole firewall da creare nel pannello:

# (expression) -> (action)
(cf.client.bot)                                      -> Managed Challenge
(http.user_agent contains "AhrefsBot")               -> Block
(http.user_agent contains "SemrushBot")              -> Block
(http.user_agent contains "MJ12bot")                 -> Block
(http.user_agent contains "Bytespider")              -> Block
(http.request.uri.path contains ".env")              -> Block
(http.request.uri.path contains "wp-")               -> Block
(http.request.uri.path contains "xmlrpc")            -> Block
(ip.geoip.country in {"CN" "RU"} and cf.threat_score gt 20) -> Managed Challenge
(rate(5m) > 300)                                     -> Managed Challenge

# 6. Rate limiting (pannello Cloudflare):
#    /            : 120 req / 1 min per IP  -> Challenge oltre soglia
#    /*.js, /*.css: 300 req / 1 min per IP  -> Block oltre soglia
#    /index.html  : 60 req / 1 min per IP   -> Managed Challenge

# 7. Privacy: disattivare "Rocket Loader" se da' problemi, tenere "Email Obfuscation" OFF.

# ---------- IPTABLES (se hosting VPS diretto, senza Cloudflare) ----------
# rate limit nuovo connessioni
-A INPUT -p tcp --dport 443 -m conntrack --ctstate NEW -m limit --limit 40/minute --limit-burst 80 -j ACCEPT
-A INPUT -p tcp --dport 443 -m conntrack --ctstate NEW -j DROP

# blocca porte inutili
-A INPUT -p tcp --dport 8080 -j DROP
-A INPUT -p tcp --dport 8443 -j DROP

# SYN flood
-A INPUT -p tcp --syn -m limit --limit 60/s --limit-burst 120 -j ACCEPT

# ping flood
-A INPUT -p icmp --icmp-type echo-request -m limit --limit 5/s -j ACCEPT

# ---------- IPV6 ----------
-A INPUT -p tcp --dport 443 -m conntrack --ctstate NEW -m limit --limit 40/minute --limit-burst 80 -j ACCEPT

# ---------- HARDENING SISTEMA ----------
# net.ipv4.tcp_syncookies = 1
# net.ipv4.conf.all.rp_filter = 1
# net.ipv4.icmp_echo_ignore_broadcasts = 1
# net.ipv6.conf.all.disable_ipv6 = 1   (se non usi IPv6)
